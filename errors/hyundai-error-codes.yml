rfc9457: false
note: >-
  Hyundai Developers publishes a numeric error-code registry that the specification pages
  render beneath every operation. The registry is split: one table applies to the Data API
  group, a second to the Account API group. The envelope is a flat JSON object, not
  application/problem+json, so rfc9457 is false. Error codes are string-typed in the
  envelope even though they read as integers.
envelope:
  media_type: application/json
  fields:
    - name: errId
      type: string
      description: Error ID (UUID) for support correlation; matches the Ccsp-Request-Id response header
    - name: errCode
      type: string
      description: Numeric error code from the registry below
    - name: errMsg
      type: string
      description: Human-readable detail
  example: |
    {
      "errId": "123e4567-e89b-12d3-a456-426655440000",
      "errCode": "4002",
      "errMsg": "Invalid request body"
    }
  redirect_variant:
    description: >-
      The consent-request operation (POST /api/v1/car-service/terms/agreement) is a browser
      redirect flow, so it returns errors as query parameters on a 302 Location rather than
      as a JSON body — the same three field names, URL-encoded.
    example: 'Location: redirect_url?errCode=4046&errMsg=No%20registered%20vehicles&errId=123e4567-...'
