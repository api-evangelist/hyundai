        meaning: Raised when the failure is not classified by a more specific code
      - code: '5001'
        message: Internal Server Error
        meaning: Internal API error
      - code: '9999'
        message: Undefined Error
        meaning: Internal API error
code_count: 22
collision_note: >-
  4002, 4011, 4012, 5001 and 9999 appear in BOTH groups, and 4011/4012 carry DIFFERENT
  meanings depending on group (4012 is "Invalid Session" on the Data API and "Deactivated
  User" on the Account API). A client cannot interpret errCode without also knowing which
  API group it called.
