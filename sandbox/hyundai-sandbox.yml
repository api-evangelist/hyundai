docs: https://developers.hyundai.com/web/v1/hyundai/faqs
provider: Hyundai
providerId: hyundai
summary: >-
  Hyundai Developers ships a fully anonymous, callable sample-test tier. No account, no
  project, no client credentials: the portal's own specification pages issue a public JWT
  and five fixture vehicle IDs to any visitor, and the resulting calls return real
  response payloads from a live host. Twelve of the nineteen documented operations are
  exercisable this way. Verified end to end on 2026-09-13.
modes:
  - id: sample-test
    name: 샘플테스트 (Sample Test)
    public: true
    signup_required: false
    host: https://dev.kr-ccapi.hyundai.com
    path_prefix: /api_sample/v1/
    credential_source:
      endpoint: "GET https://developers.hyundai.com/api/v1/sampleTest/getSampleTestInfo"
      auth: none
      returns:
        - testToken (a short-lived bearer JWT, issuer "bluelink")
        - carIdList (five fixture vehicle IDs)
        - domain (the sample host)
      note: >-
        The token value is deliberately NOT stored in this repository. It is minted on
        demand, it rotates, and it is secret-shaped. Fetch it from the endpoint above.
    gateway: "Tyk (X-Generator: tyk.io observed on sample-tier responses)"
  - id: development-project
    name: 개발 프로젝트 (Development project)
    public: false
    signup_required: true
    host: https://prd.kr-ccapi.hyundai.com
    description: >-
      After Hyundai integrated-account signup and console project registration, a project
      is created as a "development project" and automatically granted call permission on
      every available API. Developers may bind their OWN real vehicle if they are the
      registered CCS (Bluelink) contract holder, and read live data from it. A daily
      per-project call cap applies at this stage.
      Real customer vehicle data is unreachable until the commercialization review passes.
    test_vehicle_accounts: >-
      The FAQ states test vehicle accounts are provided for members who own no vehicle,
      with some restrictions noted as inherent to a test account.
  - id: commercial-project
    name: 상용화 프로젝트 (Commercial project)
    public: false
    signup_required: true
    host: https://prd.kr-ccapi.hyundai.com
    description: >-
      Created automatically once the commercialization review is approved. Carries its own
      Client ID / Client Secret, distinct from the development project's.
