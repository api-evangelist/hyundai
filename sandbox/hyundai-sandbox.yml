invalid_credential_behavior:
  probe: sample-tier call with Authorization Bearer invalid
  status: 403
  body: '{"error": "Key not authorized:token contains an invalid number of segments"}'
  note: >-
    The sample tier is fronted by Tyk and returns the GATEWAY error shape here, not the
    documented {errId, errCode, errMsg} envelope. A client that only parses the documented
    envelope will fail to read this error.
limitations:
  - No write operations are exercisable; the sample tier is read-only.
  - Account API operations (authorize, token, profile) are not in the sample tier.
  - Fixture timestamps are historical (2021-2022 vehicle transmission times).
  - Korea-only data; the FAQ confirms only domestic connected-car data is served.
