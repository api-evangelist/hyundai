  https://developers.hyundai.com/web/v1/hyundai/specification/ — no MCP server exists.
provider: Hyundai
providerId: hyundai
status: candidate
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: probed
  note: >-
    Hyundai ships no MCP server, hosted or local. Probed 2026-09-13:
    developers.hyundai.com/mcp -> 404, prd.kr-ccapi.hyundai.com/mcp -> 404,
