specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Hyundai
providerId: hyundai
generated: '2026-09-13'
method: searched
source: https://developers.hyundai.com/web/v1/hyundai/faqs
created: '2026-05-04'
modified: '2026-09-13'
supersedes: >-
  A 2026-05-04 bulk-sweep scaffold that invented three tiers — Free / Professional /
  Enterprise with 1,000 and 100,000 monthly request quotas, TBD overage pricing, SLA
  targets and webhook subscriptions — none of which Hyundai publishes or sells. Replaced
  2026-09-13 with the provider's own statement.
tags:
  - Automobiles
  - Connected Vehicles
  - Mobility
  - Pricing
description: >-
  Hyundai Developers publishes no pricing page and no plan tiers. Its FAQ states that API
  use has been free to date, and that whether a given integration is charged for is decided
  case by case in conversation with a Hyundai Developers representative at the point of
  commercialization review. There is therefore no tier structure to record — this file
  records the absence and the provider's own words for it, which is the honest measurement.
plan_count: 0
pricing_page: null
pricing_model: negotiated-at-commercialization
currency: null
plans: []
findings:
  - id: free-to-date
    statement_ko: 현재까지 API 사용은 무료이나, 상용화 서비스 신청시 Hyundai Developers 담당자와의 협의를 통해 과금 여부가 결정될 수는 있습니다.
    statement_en: >-
      API use has been free to date, but whether charges apply may be decided through
      consultation with a Hyundai Developers representative when applying for a
      commercialized service.
    evidence:
      url: https://developers.hyundai.com/web/v1/hyundai/faqs
      status: 200
      date: '2026-09-13'
  - id: future-pricing-notice
    statement_ko: 추후 과금 관련 정책이 변경될 경우 별도 고지 예정입니다.
    statement_en: If the charging policy changes in future, separate notice will be given.
    evidence:
      url: https://developers.hyundai.com/web/v1/hyundai/faqs
      status: 200
      date: '2026-09-13'
  - id: gate-is-review-not-payment
    statement: >-
      The real gate on this API is not price but the commercialization review
      (상용화 심사) — a manual approval taking up to two weeks of business days, in which
      Hyundai staff check the integration's development process and legal position before
      any real customer vehicle data is released. Business-entity registration details must
      match the applicant's business licence or the application is rejected.
    evidence:
      url: https://developers.hyundai.com/web/v1/hyundai/guide_launch
      status: 200
      date: '2026-09-13'
  - id: b2b-contract-tier
    statement: >-
      A separate B2B tier exists behind a negotiated commercial agreement, surfaced in the
      console only for partners who have one. Its terms are not published.
    evidence:
      url: https://developers.hyundai.com/web/v1/hyundai/guide_console
      status: 200
      date: '2026-09-13'
