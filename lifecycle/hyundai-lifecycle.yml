onboarding_lifecycle:
  stages:
    - id: signup
      name: 회원가입
      description: >-
        Hyundai integrated-account signup, then Hyundai Developers membership. Since the
        2022-06-30 platform revision this requires no documents and no approval — simple
        identity verification only.
      docs: https://developers.hyundai.com/web/v1/hyundai/guide_regist
    - id: development-project
      name: 개발 프로젝트
      description: >-
        Registered in the console; issues Client ID / Client Secret and auto-grants call
        permission on every available API. Subject to a daily per-project call cap. One
        project per service — projects may not be reused across services.
      docs: https://developers.hyundai.com/web/v1/hyundai/guide_console
    - id: commercialization-review
      name: 상용화 심사
      description: >-
        Manual review before any real customer vehicle data is released. States are
        검토중 (under review) / 반려 (rejected) / 상용화 대기 (approved, waiting) /
        상용화 가능 (live-capable). Review takes up to two weeks of business days. Rejection
        reasons are published to the applicant, who may revise and reapply.
      docs: https://developers.hyundai.com/web/v1/hyundai/guide_launch
    - id: commercial-project
      name: 상용화 프로젝트
      description: >-
        Auto-created on approval with its own Client ID / Client Secret; permissions are
        granted only for the APIs approved in the review.
  project_continuity_risk: >-
    The console guide warns that if a project Owner withdraws from the Hyundai integrated
    account, the projects they own are deleted and the service becomes unusable. Owner
    transfer exists and is the documented mitigation.
geography:
  scope: Korea only
  note: >-
    The FAQ states the data is collected from connected cars in Korea and only domestic
    vehicle data is served, and that only Korean-language site and developer guides are
    provided. A non-Korean integrator can read the reference but cannot obtain data outside
    Korea.
  evidence: https://developers.hyundai.com/web/v1/hyundai/faqs
prerequisite: >-
  Every integration depends on the vehicle being enrolled in Bluelink, Hyundai's
  connected-car service. Vehicles shared to or from the account are excluded from the
  vehicle list and are unreadable.
