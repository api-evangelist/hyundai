apis:
  - aid: hyundai:hyundai-developer-api
    name: Hyundai Developers Connected Car API
    description: >-
      Hyundai Developers exposes connected-car data from Bluelink-enrolled vehicles to
      third-party services over a REST API on prd.kr-ccapi.hyundai.com. Nineteen operations
      are published across five groups: account (OAuth authorize, token issue/refresh/delete,
      user profile), vehicle profile (vehicle list, connected-service contract), vehicle
      status (odometer, distance to empty, EV battery, EV charging), warning lights (seven
      lamps), and service consent (third-party provision agreement and withdrawal), plus one
      outbound delete callback. Authentication is OAuth 2.0 authorization code with a Bearer
      access token; there is no published OpenAPI. Data is limited to vehicles in South Korea.
    humanURL: https://developers.hyundai.com/
    baseURL: https://prd.kr-ccapi.hyundai.com
