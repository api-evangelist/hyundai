aid: hyundai
name: Hyundai
description: >-
  Hyundai Motor Company is a South Korean multinational automotive manufacturer and, through
  Hyundai Developers, the operator of a connected-car data platform for third-party
  developers. The platform exposes the Hyundai integrated account over OAuth 2.0 and serves
  nineteen documented REST operations covering user profile, vehicle list, connected-service
  contract dates, odometer, distance-to-empty, EV battery and charging state, and seven
  warning-light indicators, sourced from vehicles enrolled in Bluelink. Access is governed by
  a two-stage consent model built around the Korean Personal Information Protection Act — a
  per-vehicle OAuth consent plus a separate third-party data-provision consent — and a manual
  commercialization review before any real customer vehicle data is released. The API
  reference, a public sample-test tier with fixture vehicles, and the developer guide are all
  readable without an account; data is limited to vehicles in South Korea.
